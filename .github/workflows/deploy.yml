name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            cd /opt/masarat
            git pull origin main
            docker build -t masarat .
            docker stop masarat || true
            docker rm masarat || true
            docker run -d \
              --name masarat \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file .env \
              -v masarat-uploads:/app/public/uploads \
              masarat
            docker image prune -f
